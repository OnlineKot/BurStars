<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b23a00" />
    <title>BurStars — Skala Burgerowa</title>
    <script type="module" src="/BurStars/assets/index-BK0Iit_W.js"></script>
    <link rel="stylesheet" href="/BurStars/assets/index-DAkWwyt_.css">
  </head>
  <body>
    <div id="root">
      <div id="boot" style="font-family: system-ui, sans-serif; padding: 24px; color: #7a6d60">
        Ładowanie BurStars… 🍔
      </div>
    </div>

    <!-- Diagnostyka: jesli aplikacja nie wystartuje, pokaz blad na stronie
         zamiast bialego ekranu (pomaga na urzadzeniach bez dostepu do konsoli). -->
    <script>
      (function () {
        function showError(title, detail) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="font-family: system-ui, sans-serif; padding: 20px; color: #241a12">' +
            '<h2 style="color:#c0392b; margin:0 0 8px">⚠️ ' + title + '</h2>' +
            '<pre style="white-space: pre-wrap; word-break: break-word; background:#faf3ef; border:1px solid #ece3d8; border-radius:10px; padding:12px; font-size:13px; color:#8f2e00">' +
            String(detail).replace(/[<>]/g, '') +
            '</pre>' +
            '<p style="color:#7a6d60; font-size:13px">Zrób zrzut ekranu i wyślij — to nam powie, co naprawić.</p>' +
            '</div>';
        }
        // capture=true lapie takze bledy ladowania zasobow (script/link).
        window.addEventListener(
          'error',
          function (e) {
            var el = e && e.target;
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              showError('Nie udało się załadować pliku', el.src || el.href || '(nieznany)');
              return;
            }
            var msg = (e && e.message) || 'Nieznany błąd';
            if (e && e.filename) msg += '\n@ ' + e.filename + ':' + e.lineno + ':' + e.colno;
            showError('Błąd JavaScript', msg);
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          showError('Nieobsłużony błąd', (r && (r.message || r.code)) || r);
        });
        // Jesli po 8s aplikacja nadal nie wystartowala (placeholder wciaz widoczny),
        // pokaz komunikat zamiast wiecznego "Ładowanie".
        setTimeout(function () {
          if (document.getElementById('boot')) {
            showError(
              'Aplikacja nie wystartowała',
              'Skrypt nie wykonał się w ~8 s. Zwykle to problem z pobraniem pliku JS albo zgodnością przeglądarki.',
            );
          }
        }, 8000);
      })();
    </script>

  </body>
</html>
