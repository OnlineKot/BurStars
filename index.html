<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b23a00" />
    <title>BurStars — Skala Burgerowa</title>
    <script type="module" src="/BurStars/assets/index-tufBu1y4.js"></script>
    <link rel="stylesheet" href="/BurStars/assets/index-weBiGNKR.css">
  </head>
  <body>
    <div id="root">
      <div class="boot" id="boot">
        <div class="boot__logo">🍔</div>
        <div class="boot__text">Ładowanie…</div>
      </div>
    </div>

    <style>
      .boot {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: system-ui, sans-serif;
        color: #7a6d60;
      }
      .boot__logo {
        font-size: 3rem;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
      }
    </style>

    <!-- Awaryjny komunikat: zamiast bialego ekranu, gdy aplikacja sie nie zaladuje. -->
    <script>
      (function () {
        function showError() {
          var root = document.getElementById('root');
          if (!root || !document.getElementById('boot')) return;
          root.innerHTML =
            '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px;font-family:system-ui,sans-serif;color:#241a12">' +
            '<div style="font-size:2.5rem">🍔</div>' +
            '<h2 style="margin:0;color:#b23a00">Nie udało się załadować</h2>' +
            '<p style="color:#7a6d60;max-width:320px">Sprawdź połączenie z internetem i odśwież stronę.</p>' +
            '<button onclick="location.reload()" style="margin-top:8px;border:none;background:#b23a00;color:#fff;font-weight:600;padding:12px 20px;border-radius:10px;cursor:pointer">Odśwież</button>' +
            '</div>';
        }
        window.addEventListener('error', showError, true);
        window.addEventListener('unhandledrejection', showError);
        setTimeout(showError, 10000);
      })();
    </script>

  </body>
</html>
