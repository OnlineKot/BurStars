name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/burstars-burger-app-fpjx2x]
  workflow_dispatch:

# Publikacja na galaz gh-pages wymaga zapisu do repozytorium.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Na Pages nie ma emulatorow — laczymy sie z prawdziwym Firebase.
          # Config Firebase czytany jest z pliku .env.production.
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      # Publikacja zbudowanej aplikacji na galaz gh-pages.
      # Dla publicznego repo GitHub zwykle sam wlacza Pages z tej galezi.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Dodaje .nojekyll, aby katalog /assets nie byl przetwarzany przez Jekyll.
          enable_jekyll: false
