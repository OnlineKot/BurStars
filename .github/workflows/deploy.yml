name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/burstars-burger-app-fpjx2x]
  workflow_dispatch:

# CI commituje zbudowana aplikacje do katalogu app/ na tej samej galezi,
# ktora serwuje GitHub Pages (Settings -> Pages wskazuje na ta galaz).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Na Pages nie ma emulatorow — laczymy sie z prawdziwym Firebase.
          # Config Firebase czytany jest z pliku .env.production.
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      # Pages serwuje ta galaz — wiec zbudowana aplikacja trafia do app/,
      # a index.html w korzeniu przekierowuje na /BurStars/app/.
      # "[skip ci]" zapobiega zapetleniu workflow po wlasnym pushu.
      - name: Publish built app to app/ on this branch
        run: |
          rm -rf app
          mkdir app
          cp -r dist/* app/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A app
          if git diff --cached --quiet; then
            echo "Brak zmian w app/ — pomijam commit."
          else
            git commit -m "chore: publish built app to app/ [skip ci]"
            git push
          fi
