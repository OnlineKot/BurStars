name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/burstars-burger-app-fpjx2x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pozwol na jeden rownolegly deploy; nie przerywaj trwajacego wdrozenia.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Na Pages nie ma emulatorow — laczymy sie z prawdziwym Firebase.
          # Wartosci konfiguracji Firebase czytane sa z pliku .env.production
          # (config webowy Firebase nie jest tajny — i tak trafia do przegladarki).
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
