name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/burstars-burger-app-fpjx2x]
  workflow_dispatch:

# Publikacja na galaz gh-pages wymaga zapisu do repozytorium;
# pages: write pozwala przestawic zrodlo Pages przez API.
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Na Pages nie ma emulatorow — laczymy sie z prawdziwym Firebase.
          # Config Firebase czytany jest z pliku .env.production.
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      # Publikacja zbudowanej aplikacji na galaz gh-pages.
      # Dla publicznego repo GitHub zwykle sam wlacza Pages z tej galezi.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Dodaje .nojekyll, aby katalog /assets nie byl przetwarzany przez Jekyll.
          enable_jekyll: false

      # Pages bylo recznie ustawione na galaz zrodlowa (serwowalo surowy kod).
      # Ten krok przestawia zrodlo Pages na gh-pages przez API i prosi o rebuild.
      # continue-on-error: gdy token nie ma uprawnien, deploy i tak sie udal —
      # wtedy zrodlo trzeba przestawic raz recznie w Settings -> Pages.
      - name: Point Pages at gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "PUT /pages -> HTTP $code"
          cat /tmp/pages.json || true
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
